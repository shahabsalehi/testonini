name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: TestPractice-linux-x64
            pip_flags: ""
          - os: windows-latest
            artifact: TestPractice-windows-x64
            pip_flags: ""
          - os: macos-13        # last Intel runner; fine for Intel + can build universal2 if SDK allows
            artifact: TestPractice-macos-x64
            pip_flags: ""
          - os: macos-14        # Apple Silicon; a universal2 build here covers Intel+M1+
            artifact: TestPractice-macos-arm64
            pip_flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps (isolated to runner)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab firecrawl-anydoc pymupdf pystray pillow
      - name: Build (linux/macos)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --noconsole --name TestPractice \
            --add-data 'index.html:.' --add-data 'style.css:.' --add-data 'app.js:.' --add-data 'pdf.js:.' --add-data 'vendor/pdfjs:vendor/pdfjs' \
            --hidden-import launch_reportlab_marker --hidden-import anydoc \
            --exclude-module cryptography --exclude-module botocore --exclude-module boto3 \
            --exclude-module numpy --exclude-module pandas \
            --exclude-module torch --exclude-module tkinter \
            launch.py
      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name TestPractice `
            --add-data 'index.html;.' --add-data 'style.css;.' --add-data 'app.js;.' --add-data 'pdf.js;.' --add-data 'vendor/pdfjs;vendor/pdfjs' `
            --hidden-import launch_reportlab_marker --hidden-import anydoc --hidden-import pystray `
            --exclude-module cryptography --exclude-module botocore `
            --exclude-module numpy --exclude-module pandas --exclude-module tkinter `
            launch.py
      - name: Smoke test (linux) — binary alone, no sidecars
        if: runner.os == 'Linux'
        run: |
          mkdir -p isolated && cp dist/TestPractice isolated/
          cd isolated && ./TestPractice > /dev/null 2>&1 &
          TESTPID=$!
          sleep 10
          curl -f http://localhost:5874/healthz
          curl -f http://localhost:5874/index.html -o /dev/null
          curl -f http://localhost:5874/app.js -o /dev/null
          curl -f http://localhost:5874/vendor/pdfjs/pdf.min.mjs -o /dev/null
          kill $TESTPID
      - name: Ad-hoc sign (macOS) — avoids "damaged" warnings on Apple Silicon
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/TestPractice
      - name: SHA-256 checksums
        if: runner.os == 'Linux'
        run: |
          cd dist && sha256sum TestPractice > TestPractice.sha256
      - name: SHA-256 checksums
        if: runner.os == 'macOS'
        run: |
          cd dist && shasum -a 256 TestPractice > TestPractice.sha256
      - name: SHA-256 checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-FileHash dist\TestPractice.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist\TestPractice.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/TestPractice*
